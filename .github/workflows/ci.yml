name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Volm is Windows only; the checks below analyze it as built for Windows.
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The newest patch release of that Go version, with its security fixes.
          check-latest: true
      - run: bash scripts/check-format.sh
      # unsafeptr is off: COM objects and low-level hooks get pointers from Windows as uintptr.
      - run: go vet -unsafeptr=false ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go mod tidy -diff
      # Built for the runner, then run with GOOS=windows to analyze the Windows build.
      - run: GOOS= GOARCH= go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: "$(go env GOPATH)/bin/govulncheck ./..."

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The newest patch release of that Go version, with its security fixes.
          check-latest: true
      - run: bash scripts/check-generated.sh

  test:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The newest patch release of that Go version, with its security fixes.
          check-latest: true
      - run: go build ./...
      # The tests that change the system volume need VOLM_INTEGRATION=1 and a playback device, which runners lack; they skip here.
      - run: go test -race ./...
      - run: go tool mygo build -skip-installer
      # Compiles installer/volm.iss, so that a broken script shows before a release.
      - run: bash scripts/build-installer.sh 0.0.0
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: volm-windows-amd64
          path: build/windows-amd64/Volm.exe
          if-no-files-found: error

  release-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bash scripts/release/check-next-version.sh
