name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bump (patch, minor, major, prerelease) or explicit version
        type: string
        required: true
      preid:
        description: Optional prerelease identifier (lowercase letters)
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      retry: ${{ steps.version.outputs.retry }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: version
        env:
          VERSION: ${{ inputs.version }}
          PREID: ${{ inputs.preid }}
        run: bash scripts/release/next-version.sh >> "$GITHUB_OUTPUT"
      - id: ref
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RETRY: ${{ steps.version.outputs.retry }}
        run: bash scripts/release/select-ref.sh >> "$GITHUB_OUTPUT"

  checks:
    needs: select
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.select.outputs.ref }}

  build:
    needs: [select, checks]
    runs-on: windows-latest
    env:
      TAG: ${{ needs.select.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The newest patch release of that Go version, with its security fixes.
          check-latest: true
      # mygo build writes the version of mygo.json into the executable; the tag decides it, not the committed file.
      - name: Set the version from the tag
        shell: pwsh
        run: |
          $config = Get-Content mygo.json -Raw | ConvertFrom-Json
          $config.version = $env:TAG.TrimStart('v')
          $config | ConvertTo-Json -Depth 10 | Set-Content mygo.json -Encoding utf8NoBOM
      - run: go tool mygo build -skip-installer
      - name: Package
        shell: bash
        run: |
          version=${TAG#v}
          name="Volm-$version-windows-amd64"
          mkdir -p "dist/$name"
          cp build/windows-amd64/Volm.exe LICENSE THIRD_PARTY_NOTICES.md README.md "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null && rm -rf "$name" && sha256sum "$name.zip" > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [select, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.select.outputs.tag }}
      RETRY: ${{ needs.select.outputs.retry }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - if: env.RETRY == 'false'
        run: git tag "$TAG" && git push origin "refs/tags/$TAG"
      - run: bash scripts/release/create-release.sh
